services:
  medivoice-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: medivoice-backend:latest
    container_name: medivoice_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - CLINIVARA_APP_ENV=production
      - CLINIVARA_DEBUG=false
      - CLINIVARA_AUTH_SECRET_KEY=change_this_to_a_secure_32_byte_secret_in_prod
      - CLINIVARA_STORAGE_ROOT=/app/data/storage
      - CLINIVARA_MAX_UPLOAD_SIZE_BYTES=26214400
      - CLINIVARA_OCR_ENABLED=true
      - CLINIVARA_OCR_DEFAULT_LANGUAGE=eng
      - CLINIVARA_DEID_CONFIDENCE_THRESHOLD=0.60
      - CLINIVARA_AUDIT_LOG_PATH=/app/data/audit/audit_events.jsonl
      - CLINIVARA_LLM_PROVIDER=mock
    volumes:
      # Boundary A: Restricted Raw Document Storage
      - medivoice_boundary_a:/app/data/storage/boundary_a_raw
      # Boundary C: Approved Output Vault
      - medivoice_boundary_c:/app/data/storage/boundary_c_approved
      # Token Vault for Pseudonymization
      - medivoice_token_vault:/app/data/storage/token_vault
      # Audit Logs
      - medivoice_audit:/app/data/audit
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  medivoice-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: medivoice-frontend:latest
    container_name: medivoice_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    environment:
      # Browser-facing backend URL. Change the host/port if your backend runs elsewhere.
      - MEDIVOICE_API_BASE_URL=${MEDIVOICE_API_BASE_URL:-http://localhost:8000}
      - MEDIVOICE_API_KEY=${MEDIVOICE_API_KEY:-medivoice-dev-client-key-2024}
    depends_on:
      - medivoice-backend

volumes:
  medivoice_boundary_a:
  medivoice_boundary_c:
  medivoice_token_vault:
  medivoice_audit:
